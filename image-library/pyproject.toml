[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumilib"
version = "0.19.2"
description = "Re'memor：硬碟目錄、去重與全文檢索（以 Lumitake Library 為基礎）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "SEE LICENSE IN ../LICENSE" }
dependencies = [
    "Pillow>=10.0",
    "pillow-heif>=0.16",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "send2trash>=1.8",
    "qrcode>=7.4",
    "numpy>=1.24",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "imageio-ffmpeg>=0.5",
    "certifi>=2024.2",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "onnx>=1.15"]

[project.scripts]
rememor = "lumilib.cli:main"
lumilib = "lumilib.cli:main"  # 舊名稱，繼續可用

[tool.setuptools]
packages = ["lumilib"]

[tool.setuptools.package-data]
lumilib = ["web/*", "web/assets/*", "web/icons/*", "data/*"]
