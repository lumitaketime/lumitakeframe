[package]
name = "lumitake-library"
version = "0.6.0"
description = "Lumitake Library：離線 AI 照片與影片圖庫"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
libc = "0.2"

[profile.release]
strip = true
