name: Real pet recognition check

# 下載真的寵物辨識模型（YOLOX＋DINOv2），確認找得到狗、同一隻狗比不同隻更相似
on:
  push:
    branches: [main, claude/kind-dijkstra-7t80hs]
    paths:
      - "image-library/lumilib/petid.py"
      - "image-library/tools/pets_e2e.py"
      - ".github/workflows/pets-e2e.yml"
  workflow_dispatch:

concurrency:
  group: pets-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model: [standard, fast, accurate]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝
        working-directory: image-library
        run: pip install -e .

      - name: 下載測試照片
        run: |
          mkdir -p /tmp/petimg
          curl -fsSL -o /tmp/petimg/dog.jpg https://raw.githubusercontent.com/Megvii-BaseDetection/YOLOX/main/assets/dog.jpg
          curl -fsSL -o /tmp/petimg/samoyed.jpg https://raw.githubusercontent.com/pytorch/hub/master/images/dog.jpg

      - name: 辨識
        working-directory: image-library
        run: python tools/pets_e2e.py ${{ matrix.model }} /tmp/petimg
